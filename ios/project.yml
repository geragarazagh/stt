# STT for iPhone. Generated into STT.xcodeproj by `make` (XcodeGen); the project file itself is not kept in git.
# The heart is ../shared (engine, dictionary, models, download, settings store, Shortcuts actions), as on the Mac.
name: STT
options:
  bundleIdPrefix: com.geragaraza
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 4PWXU4KC48
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only (stt-iphone.md, «The spec»); the iPhone Duo is an iPhone
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "2"   # build 1 was uploaded as iPhone + iPad (2026-11-12)
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
targets:
  STT:
    type: application
    platform: iOS
    sources:
      - app
      - common
      - path: ../shared
      - path: ../vendor
        includes: ["*.swift", "silero-vad-v6.2-F32.gguf"]
      - gen/loc        # en/ru/uk .lproj, merged by `make` from ../mac/lang and lang/
      - gen/AppIcon.icon
      - Symbols.xcassets
    info:
      path: gen/Info.plist
      properties:
        CFBundleDisplayName: STT
        CFBundleName: STT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ru, uk]
        NSMicrophoneUsageDescription: Speech is turned into text on this iPhone and goes nowhere.
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    dependencies:
      - framework: ../vendor/TranscribeCpp.xcframework
        embed: true
      - target: STTWidget
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: libc++.tbd
      - sdk: libz.tbd
    entitlements:
      path: gen/STT.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.geragaraza.stt
        com.apple.security.application-groups: [group.com.geragaraza.stt]   # recording or not, for the Record control
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geragaraza.stt
        PRODUCT_NAME: STT
        TARGETED_DEVICE_FAMILY: "1"   # again per target: XcodeGen's iOS app preset sets "1,2" here over the project's
                                      # value, and build 1 went to App Store Connect as an iPad app too (2026-11-12)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  STTWidget:
    type: app-extension
    platform: iOS
    sources:
      - widget
      - common
      - Symbols.xcassets
      - path: ../shared/intents.swift
    info:
      path: gen/Widget-Info.plist
      properties:
        CFBundleDisplayName: STT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: gen/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.geragaraza.stt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geragaraza.stt.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET   # keeps DEBUG in Debug builds
